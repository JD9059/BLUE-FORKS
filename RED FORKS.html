<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Blue Forks</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #bfe9ff;
        color: #17324d;
    }

    header {
        background: #5bbce8;
        color: white;
        text-align: center;
        padding: 30px 15px;
        border-bottom: 6px solid white;
    }

    header h1 {
        margin: 0;
        font-size: 45px;
    }

    header p {
        margin-bottom: 0;
        font-size: 18px;
    }

    .container {
        width: 90%;
        max-width: 700px;
        margin: 30px auto;
    }

    .card {
        background: white;
        padding: 25px;
        border-radius: 20px;
        margin-bottom: 20px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }

    h2 {
        margin-top: 0;
    }

    label {
        display: block;
        font-weight: bold;
        margin-top: 18px;
        margin-bottom: 7px;
    }

    select,
    input {
        width: 100%;
        padding: 13px;
        font-size: 17px;
        border-radius: 10px;
        border: 2px solid #91d8f7;
    }

    button {
        border: none;
        border-radius: 10px;
        padding: 13px 18px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }

    .mainButton {
        width: 100%;
        margin-top: 20px;
        background: #168bd2;
        color: white;
    }

    .mainButton:hover {
        background: #0875b8;
    }

    .ingredientButton {
        width: 100%;
        background: #e5f7ff;
        color: #17324d;
        text-align: left;
        margin-top: 5px;
    }

    #ingredientsBox {
        display: none;
        background: #f4fbff;
        padding: 15px;
        margin-top: 8px;
        border-radius: 10px;
    }

    .ingredient {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 8px 0;
        font-weight: normal;
    }

    .ingredient input {
        width: auto;
    }

    .sauceButtons {
        display: flex;
        gap: 10px;
    }

    .choiceButton {
        flex: 1;
        background: #e5f7ff;
    }

    .choiceButton.selected {
        background: #168bd2;
        color: white;
    }

    #confirmationPage,
    #ordersPage {
        display: none;
    }

    .orderSummary {
        background: #eefaff;
        border-radius: 12px;
        padding: 15px;
        line-height: 1.7;
    }

    .orderCard {
        background: #eefaff;
        border: 2px solid #91d8f7;
        padding: 15px;
        border-radius: 15px;
        margin-top: 15px;
    }

    .finishButton {
        background: #40b96e;
        color: white;
        margin-right: 8px;
        margin-top: 10px;
    }

    .cancelButton {
        background: #e55353;
        color: white;
        margin-top: 10px;
    }

    .allOrdersButton {
        position: fixed;
        top: 15px;
        right: 15px;
        background: white;
        color: #168bd2;
        z-index: 10;
    }

    .backButton {
        background: #555;
        color: white;
        margin-bottom: 15px;
    }

    .message {
        text-align: center;
        font-weight: bold;
        font-size: 20px;
        margin-top: 15px;
    }
</style>
</head>

<body>

<button class="allOrdersButton" onclick="showOrders()">
    🍕 All Orders
</button>

<header>
    <h1>🍕 The Blue Forks 🍴</h1>
    <p>Fresh pizza made your way!</p>
</header>

<div class="container">

    <!-- ORDER PAGE -->

    <div id="orderPage">

        <div class="card">

            <h2>Build Your Pizza</h2>

            <label for="pizzaType">Type of Pizza</label>

            <select id="pizzaType">
                <option value="">Choose a pizza...</option>
                <option>Cheese Pizza</option>
                <option>Pepperoni Pizza</option>
                <option>Sausage Pizza</option>
                <option>Veggie Pizza</option>
                <option>Supreme Pizza</option>
                <option>Hawaiian Pizza</option>
                <option>Meat Lovers Pizza</option>
                <option>BBQ Chicken Pizza</option>
                <option>Buffalo Chicken Pizza</option>
                <option>Margherita Pizza</option>
                <option>White Pizza</option>
                <option>Mushroom Pizza</option>
                <option>Bacon Pizza</option>
                <option>Chicken Pizza</option>
                <option>Custom Pizza</option>
            </select>


            <label>Extra Ingredients</label>

            <button class="ingredientButton" onclick="toggleIngredients()">
                ➕ Ingredients
            </button>

            <div id="ingredientsBox">

                <label class="ingredient">
                    <input type="checkbox" value="Extra Cheese">
                    Extra Cheese
                </label>

                <label class="ingredient">
                    <input type="checkbox" value="Pepperoni">
                    Pepperoni
                </label>

                <label class="ingredient">
                    <input type="checkbox" value="Sausage">
                    Sausage
                </label>

                <label class="ingredient">
                    <input type="checkbox" value="Bacon">
                    Bacon
                </label>

                <label class="ingredient">
                    <input type="checkbox" value="Ham">
                    Ham
                </label>

                <label class="ingredient">
                    <input type="checkbox" value="Chicken">
                    Chicken
                </label>

                <label class="ingredient">
                    <input type="checkbox" value="Mushrooms">
                    Mushrooms
                </label>

                <label class="ingredient">
                    <input type="checkbox" value="Onions">
                    Onions
                </label>

                <label class="ingredient">
                    <input type="checkbox" value="Green Peppers">
                    Green Peppers
                </label>

                <label class="ingredient">
                    <input type="checkbox" value="Black Olives">
                    Black Olives
                </label>

                <label class="ingredient">
                    <input type="checkbox" value="Pineapple">
                    Pineapple
                </label>

                <label class="ingredient">
                    <input type="checkbox" value="Jalapeños">
                    Jalapeños
                </label>

            </div>


            <label>Sauce?</label>

            <div class="sauceButtons">

                <button
                    id="yesSauce"
                    class="choiceButton"
                    onclick="chooseSauce('Yes')">
                    Yes
                </button>

                <button
                    id="noSauce"
                    class="choiceButton"
                    onclick="chooseSauce('No')">
                    No
                </button>

            </div>


            <label for="firstName">First Name</label>
            <input id="firstName" placeholder="First name">


            <label for="lastName">Last Name</label>
            <input id="lastName" placeholder="Last name">


            <button class="mainButton" onclick="reviewOrder()">
                Review Order 🍕
            </button>

        </div>

    </div>


    <!-- CONFIRMATION PAGE -->

    <div id="confirmationPage">

        <div class="card">

            <h2>Is Your Order Correct?</h2>

            <div
                id="confirmationDetails"
                class="orderSummary">
            </div>

            <button
                class="mainButton"
                onclick="confirmOrder()">
                ✅ Confirm Order
            </button>

            <button
                class="mainButton"
                onclick="editOrder()"
                style="background:#777;">
                ✏️ Go Back & Edit
            </button>

        </div>

    </div>


    <!-- ALL ORDERS PAGE -->

    <div id="ordersPage">

        <button
            class="backButton"
            onclick="goHome()">
            ← Back
        </button>

        <div class="card">

            <h2>🍕 Received Orders</h2>

            <div id="ordersList">
                No orders yet.
            </div>

        </div>

    </div>

</div>


<script>

let sauceChoice = "";

let currentOrder = null;

let orders =
    JSON.parse(localStorage.getItem("blueForksOrders")) || [];


function toggleIngredients() {

    const box =
        document.getElementById("ingredientsBox");

    if (box.style.display === "block") {
        box.style.display = "none";
    } else {
        box.style.display = "block";
    }
}


function chooseSauce(choice) {

    sauceChoice = choice;

    document
        .getElementById("yesSauce")
        .classList.remove("selected");

    document
        .getElementById("noSauce")
        .classList.remove("selected");

    if (choice === "Yes") {

        document
            .getElementById("yesSauce")
            .classList.add("selected");

    } else {

        document
            .getElementById("noSauce")
            .classList.add("selected");

    }
}


function reviewOrder() {

    const pizza =
        document.getElementById("pizzaType").value;

    const firstName =
        document.getElementById("firstName").value.trim();

    const lastName =
        document.getElementById("lastName").value.trim();


    if (!pizza) {
        alert("Please choose a pizza!");
        return;
    }


    if (!sauceChoice) {
        alert("Please choose Yes or No for sauce!");
        return;
    }


    if (!firstName || !lastName) {
        alert("Please enter your first and last name!");
        return;
    }


    const ingredientBoxes =
        document.querySelectorAll(
            "#ingredientsBox input:checked"
        );


    const ingredients = [];

    ingredientBoxes.forEach(function(box) {
        ingredients.push(box.value);
    });


    currentOrder = {

        id: Date.now(),

        firstName: firstName,

        lastName: lastName,

        pizza: pizza,

        ingredients: ingredients,

        sauce: sauceChoice,

        orderedAt:
            new Date().toLocaleString(),

        status: "Received"
    };


    let ingredientText = "None";

    if (ingredients.length > 0) {
        ingredientText = ingredients.join(", ");
    }


    document.getElementById(
        "confirmationDetails"
    ).innerHTML =

        "<strong>Name:</strong> " +
        firstName + " " + lastName +

        "<br><strong>Pizza:</strong> " +
        pizza +

        "<br><strong>Extra Ingredients:</strong> " +
        ingredientText +

        "<br><strong>Sauce:</strong> " +
        sauceChoice;


    document.getElementById(
        "orderPage"
    ).style.display = "none";


    document.getElementById(
        "confirmationPage"
    ).style.display = "block";
}


function editOrder() {

    document.getElementById(
        "confirmationPage"
    ).style.display = "none";

    document.getElementById(
        "orderPage"
    ).style.display = "block";
}


function confirmOrder() {

    orders.push(currentOrder);

    saveOrders();

    alert(
        "🍕 Order received! The Blue Forks is on it!"
    );

    clearForm();

    goHome();
}


function saveOrders() {

    localStorage.setItem(
        "blueForksOrders",
        JSON.stringify(orders)
    );
}


function showOrders() {

    document.getElementById(
        "orderPage"
    ).style.display = "none";

    document.getElementById(
        "confirmationPage"
    ).style.display = "none";

    document.getElementById(
        "ordersPage"
    ).style.display = "block";

    displayOrders();
}


function displayOrders() {

    const list =
        document.getElementById("ordersList");


    const activeOrders =
        orders.filter(function(order) {
            return order.status === "Received";
        });


    if (activeOrders.length === 0) {

        list.innerHTML =
            "<p>No orders waiting! 🍕</p>";

        return;
    }


    list.innerHTML = "";


    activeOrders.forEach(function(order) {

        let ingredients = "None";

        if (order.ingredients.length > 0) {
            ingredients =
                order.ingredients.join(", ");
        }


        const card =
            document.createElement("div");

        card.className = "orderCard";


        card.innerHTML =

            "<strong>👤 " +
            order.firstName +
            " " +
            order.lastName +
            "</strong>" +

            "<br><br>" +

            "<strong>Pizza:</strong> " +
            order.pizza +

            "<br>" +

            "<strong>Ingredients:</strong> " +
            ingredients +

            "<br>" +

            "<strong>Sauce:</strong> " +
            order.sauce +

            "<br>" +

            "<strong>Ordered:</strong> " +
            order.orderedAt +

            "<br><br>" +

            "<button class='finishButton' " +
            "onclick='finishOrder(" +
            order.id +
            ")'>✅ Finish</button>" +

            "<button class='cancelButton' " +
            "onclick='cancelOrder(" +
            order.id +
            ")'>❌ Cancel</button>";


        list.appendChild(card);
    });
}


function finishOrder(id) {

    const order =
        orders.find(function(order) {
            return order.id === id;
        });


    if (!order) {
        return;
    }


    order.status = "Finished";

    order.finishedAt =
        new Date().toLocaleString();


    saveOrders();

    displayOrders();


    alert(
        "✅ Order finished at " +
        order.finishedAt
    );
}


function cancelOrder(id) {

    const sure =
        confirm(
            "Are you sure you want to cancel this order?"
        );


    if (!sure) {
        return;
    }


    const order =
        orders.find(function(order) {
            return order.id === id;
        });


    if (!order) {
        return;
    }


    order.status = "Cancelled";

    order.cancelledAt =
        new Date().toLocaleString();


    saveOrders();

    displayOrders();
}


function clearForm() {

    document.getElementById(
        "pizzaType"
    ).value = "";


    document.getElementById(
        "firstName"
    ).value = "";


    document.getElementById(
        "lastName"
    ).value = "";


    document
        .querySelectorAll(
            "#ingredientsBox input"
        )
        .forEach(function(box) {
            box.checked = false;
        });


    sauceChoice = "";


    document
        .getElementById("yesSauce")
        .classList.remove("selected");


    document
        .getElementById("noSauce")
        .classList.remove("selected");


    currentOrder = null;
}


function goHome() {

    document.getElementById(
        "ordersPage"
    ).style.display = "none";

    document.getElementById(
        "confirmationPage"
    ).style.display = "none";

    document.getElementById(
        "orderPage"
    ).style.display = "block";
}

</script>

</body>
</html>
